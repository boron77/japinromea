<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Romaji → 한국어</title>
<style>
:root{--bg:#f7f6f3;--card:#fff;--tx:#1d1d1b;--mut:#77756f;--bd:#e3e0d8;--ac:#c2410c;--er:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--tx:#f0eee8;--mut:#9a978f;--bd:#34332f;--ac:#fb923c;--er:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#222220;--tx:#f0eee8;--mut:#9a978f;--bd:#34332f;--ac:#fb923c;--er:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.1rem;margin:0 0 4px}
.sub{color:var(--mut);font-size:.85rem;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:12px}
textarea{width:100%;min-height:110px;border:0;outline:0;resize:vertical;background:transparent;color:var(--tx);font:inherit;font-size:1.25rem}
.reading{font-size:.95rem;color:var(--mut);min-height:1.5em;margin-top:6px;border-top:1px dashed var(--bd);padding-top:8px;word-break:break-all}
.reading b{color:var(--tx);font-weight:500}
.reading i{color:var(--ac);font-style:normal}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.lab{font-size:.75rem;letter-spacing:.04em;color:var(--mut);text-transform:uppercase}
.out{font-size:1.2rem;min-height:1.8em;word-break:break-word;white-space:pre-wrap}
.out.ph{color:var(--mut);font-size:.95rem}
button{font:inherit;font-size:.8rem;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--ac);color:var(--ac)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:.8rem;color:var(--mut);min-height:1.6em}
.err{color:var(--er)}
.dot{display:inline-block;width:10px;height:10px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:s .7s linear infinite;vertical-align:-1px;margin-right:6px}
.kj{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}
.kj:empty{display:none}
.chip{border:1px solid var(--bd);border-radius:10px;padding:6px 10px;min-width:72px}
.chip .w{font-size:1.15rem;line-height:1.3}
.chip .y{font-size:.72rem;color:var(--ac)}
.chip .h{font-size:.78rem;color:var(--mut);margin-top:2px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main>
  <h1>Romaji → 日本語 → 한국어</h1>
  <p class="sub">로마자로 일본어 발음을 입력하세요. 예: konnichiwa watashi wa gakusei desu</p>

  <div class="card">
    <textarea id="inp" placeholder="romaji here…" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus></textarea>
    <div class="reading" id="reading">히라가나가 여기에 표시됩니다</div>
  </div>

  <div class="bar"><span id="status"></span><button id="clear">지우기</button></div>

  <div class="card">
    <div class="row"><span class="lab">日本語</span><button data-copy="ja">복사</button></div>
    <div class="out ph" id="ja">—</div>
    <div class="kj" id="kj"></div>
  </div>
  <div class="card">
    <div class="row"><span class="lab">한국어</span><button data-copy="ko">복사</button></div>
    <div class="out ph" id="ko">—</div>
  </div>
</main>

<script>
/* ---------- 1. romaji → hiragana (local) ---------- */
const T = {};
const rows = {'':'あいうえお',k:'かきくけこ',s:'さすせそ',t:'たてと',n:'なにぬねの',h:'はひふへほ',m:'まみむめも',r:'らりるれろ',g:'がぎぐげご',z:'ざじずぜぞ',d:'だぢづでど',b:'ばびぶべぼ',p:'ぱぴぷぺぽ'};
const V='aiueo';
for (const c in rows){
  const full = {k:'aiueo',s:'asuseso',t:'atetoo',n:'aiueo',h:'ahieho',m:'aiueo',r:'aiueo',g:'aiueo',z:'aiueo',d:'aiueo',b:'aiueo',p:'aiueo','':'aiueo'};
  const ks = {s:['a','u','e','o'],t:['a','e','o']}[c];
  if (ks) [...rows[c]].forEach((k,i)=>T[c+ks[i]]=k);
  else [...rows[c]].forEach((k,i)=>T[c+V[i]]=k);
}
Object.assign(T,{ya:'や',yu:'ゆ',yo:'よ',wa:'わ',wo:'を',si:'し',shi:'し',ti:'ち',chi:'ち',tu:'つ',tsu:'つ',hu:'ふ',fu:'ふ',ji:'じ',
  fa:'ふぁ',fi:'ふぃ',fe:'ふぇ',fo:'ふぉ',xa:'ぁ',xi:'ぃ',xu:'ぅ',xe:'ぇ',xo:'ぉ',xya:'ゃ',xyu:'ゅ',xyo:'ょ',xtu:'っ',xtsu:'っ',
  sha:'しゃ',shu:'しゅ',she:'しぇ',sho:'しょ',cha:'ちゃ',chu:'ちゅ',che:'ちぇ',cho:'ちょ',ja:'じゃ',ju:'じゅ',je:'じぇ',jo:'じょ',
  tha:'てゃ',thi:'てぃ',dhi:'でぃ','-':'ー'});
const iCol={k:'き',g:'ぎ',n:'に',h:'ひ',b:'び',p:'ぴ',m:'み',r:'り'};
for (const c in iCol){ T[c+'ya']=iCol[c]+'ゃ'; T[c+'yu']=iCol[c]+'ゅ'; T[c+'yo']=iCol[c]+'ょ'; }
const PRE = new Set(); for (const k in T) for (let i=1;i<k.length;i++) PRE.add(k.slice(0,i));
const PUNCT = {',':'、','.':'。','?':'？','!':'！','~':'〜'};
const isV = ch => 'aiueo'.includes(ch);

function convert(src){
  const s = src.toLowerCase(); let out = '', i = 0, pending = '';
  while (i < s.length){
    const ch = s[i];
    if (!/[a-z'\-]/.test(ch)){ out += PUNCT[ch] ?? ch; i++; continue; }
    if (ch === "'"){ i++; continue; }
    if (ch === 'n'){
      const nx = s[i+1];
      if (nx === undefined){ pending = 'n'; i++; continue; }
      if (nx === 'n' || nx === "'"){ out += 'ん'; i += 2; continue; }
      if (!isV(nx) && nx !== 'y'){ out += 'ん'; i++; continue; }
    }
    if (s[i+1] === ch && !isV(ch) && ch !== 'n' && /[a-z]/.test(ch)){ out += 'っ'; i++; continue; }
    let hit = false;
    for (let l = 3; l >= 1; l--){
      const k = s.slice(i, i+l);
      if (k.length === l && T[k]){ out += T[k]; i += l; hit = true; break; }
    }
    if (hit) continue;
    const rest = s.slice(i);
    if (PRE.has(rest)){ pending = rest; break; }   // incomplete syllable at the end
    out += ch; i++;                                  // unknown letter: keep as is
  }
  return { kana: out, pending };
}

/* ---------- 2. UI + debounced translation ---------- */
const $ = id => document.getElementById(id);
const inp = $('inp'), reading = $('reading'), status = $('status'), jaEl = $('ja'), koEl = $('ko'), kjEl = $('kj');
let timer = null, seq = 0, ctrl = null, lastSent = '';
const esc = t => t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function setOut(el, text){ el.textContent = text || '—'; el.classList.toggle('ph', !text); }
function renderKanji(list){
  kjEl.textContent = '';
  (Array.isArray(list) ? list : []).forEach(it => {
    if (!it || !it.w) return;
    const d = document.createElement('div'); d.className = 'chip';
    const mk = (cls, t) => { const e = document.createElement('div'); e.className = cls; e.textContent = t; d.appendChild(e); };
    mk('w', it.w);
    if (it.yomi) mk('y', it.yomi);
    const hx = Array.isArray(it.hx) ? it.hx.join(' · ') : (it.hx || '');
    if (hx) mk('h', hx);
    kjEl.appendChild(d);
  });
}
function setStatus(html, isErr){ status.innerHTML = html; status.className = isErr ? 'err' : ''; }

function onInput(){
  const { kana, pending } = convert(inp.value);
  reading.innerHTML = (kana || pending) ? `<b>${esc(kana)}</b><i>${esc(pending)}</i>` : '히라가나가 여기에 표시됩니다';
  clearTimeout(timer);
  if (!kana.trim()){ seq++; ctrl?.abort(); lastSent=''; setOut(jaEl,''); setOut(koEl,''); renderKanji([]); setStatus(''); return; }
  timer = setTimeout(() => translate(kana + (pending === 'n' ? 'ん' : ''), pending), 550);
}

const cache = new Map();
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function api(body){
  const res = await fetch('/api/translate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body), signal: ctrl.signal });
  if (!res.ok) throw Object.assign(new Error('fail'), { code: res.status });
  return res.json();
}

async function translate(kana, pending){
  if (pending && pending !== 'n'){ setStatus('입력이 끝나지 않은 음절이 있어요…'); return; }
  const text = kana.trim();
  if (text === lastSent) { setStatus(''); return; }
  const hit = cache.get(text);
  if (hit){ seq++; ctrl?.abort(); setOut(jaEl, hit.ja); setOut(koEl, hit.ko); renderKanji(hit.kanji); lastSent = text; setStatus(''); return; }
  ctrl?.abort(); ctrl = new AbortController();
  const my = ++seq;
  setStatus('<span class="dot"></span>번역 중…');
  try {
    let data;
    for (let attempt = 0; ; attempt++){            // 1 automatic retry
      try { data = await api({ mode: 'main', text }); break; }
      catch (e){
        if (e?.name === 'AbortError' || my !== seq) return;
        if (attempt >= 1 || e.code === 400) throw e;
        await sleep(1200); if (my !== seq) return;
      }
    }
    if (my !== seq) return;                         // stale response: ignore
    setOut(jaEl, data.ja); setOut(koEl, data.ko); renderKanji([]);
    lastSent = text;
    setStatus('<span class="dot"></span>한자 주석 불러오는 중…');
    let kanji = [];
    try { kanji = (await api({ mode: 'kanji', ja: data.ja })).kanji || []; }
    catch (e){ if (e?.name === 'AbortError' || my !== seq) return; }   // annotations are optional
    if (my !== seq) return;
    renderKanji(kanji);
    cache.set(text, { ja: data.ja, ko: data.ko, kanji });
    setStatus('');
  } catch (e){
    if (my !== seq || e?.name === 'AbortError') return;
    const msg = e?.code === 429 ? '요청이 많아요. 잠시 후 다시 입력해 주세요.'
      : '번역에 실패했어요. 다시 입력하면 자동으로 재시도합니다.';
    setStatus(msg, true);
  }
}

inp.addEventListener('input', onInput);
$('clear').onclick = () => { inp.value=''; onInput(); inp.focus(); };
document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
  const el = $(b.dataset.copy); if (el.classList.contains('ph')) return;
  try { await navigator.clipboard.writeText(el.textContent); }
  catch { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); s.removeAllRanges(); }
  const o = b.textContent; b.textContent = '복사됨'; setTimeout(()=>b.textContent=o, 1000);
});
</script>
</body>
</html>
